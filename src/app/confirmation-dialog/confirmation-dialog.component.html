<h2 mat-dialog-title>{{ data.title || 'Confirmation' }}</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Annuler</button>
  <button mat-button color="primary" (click)="onConfirm()">
    {{ data.confirmButtonText || 'Oui' }}
  </button>
</mat-dialog-actions>
