<h2 mat-dialog-title>{{ data.title || 'Confirmation' }}</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close="false">Annuler</button>
  <button mat-raised-button color="warn" [mat-dialog-close]="true">Oui, annuler</button>
</mat-dialog-actions>
